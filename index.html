<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lakshya Substitute Planner by Sachin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div>
    <h1>Substitute Planner by Sachin</h1>
    <p class="sub">Lakshya International Academy · 2026–27</p>
  </div>
  <div class="ctl">
    <nav class="tabs" id="tabs">
      <button data-tab="sub" class="on">Substitution</button>
      <button data-tab="tch">Teachers</button>
    </nav>
    <input type="date" id="date" aria-label="Date">
    <span class="save-status" id="save-status" role="status" aria-live="polite">Connecting to Supabase…</span>
    <button class="pri" data-save title="Save all planner changes to Supabase">Save to Supabase</button>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast" role="status"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
